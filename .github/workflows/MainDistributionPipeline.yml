#
# Main pipeline for building and distributing the anofox_optimize extension
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:

# OIDC token needed for AWS credentials in the deploy job.
permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-next-build:
    name: Build extension binaries (DuckDB 2.0)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      extension_name: anofox_optimize
      reduced_ci_mode: disabled
      exclude_archs: 'windows_amd64_rtools;windows_amd64_mingw'

  # Loads the packaged 2.0 artifact into the official v2.0.0 CLI (the smoke script
  # fetches 2.0's duckdb-cli-*.tar.gz assets). No 2.0 deploy: the registry ships 2.0.
  duckdb-next-smoke-test:
    name: Smoke test (v2.0.0)
    needs: duckdb-next-build
    uses: ./.github/workflows/_extension_smoke_test.yml
    with:
      duckdb_version: v2.0.0
      extension_name: anofox_optimize
      exclude_archs: 'windows_amd64_rtools;windows_amd64_mingw'

  duckdb-latest-build:
    name: Build extension binaries (DuckDB latest v1.5.6)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5-variegata
      extension_name: anofox_optimize
      # windows_amd64_rtools: only needed for R package builds.
      # windows_amd64_mingw: this extension links openssl through vcpkg (for
      # telemetry) and that toolchain does not provide it reliably. NOTE: this
      # is NOT the Rust/getrandom reason the sibling repos give -- there is no
      # Rust here.
      exclude_archs: 'windows_amd64_rtools;windows_amd64_mingw'

  duckdb-latest-smoke-test:
    name: Smoke test (v1.5.6)
    needs: duckdb-latest-build
    uses: ./.github/workflows/_extension_smoke_test.yml
    with:
      duckdb_version: v1.5.6
      extension_name: anofox_optimize
      exclude_archs: 'windows_amd64_rtools;windows_amd64_mingw'

  # anofox-visualization picks up the contract producers: the definition of done
  # for docs/ANOFOX_CONTRACT_PLAN.md, so deploy waits for it.
  duckdb-latest-visualization-pickup:
    name: Visualization pickup (v1.5.6)
    needs: duckdb-latest-build
    uses: ./.github/workflows/_visualization_pickup.yml
    with:
      duckdb_version: v1.5.6
      extension_name: anofox_optimize

  # A green wasm build only proves the extension COMPILES + LINKS. This job
  # proves it LOADs and RUNS in DuckDB-Wasm (#9: every published wasm artifact
  # failed LOAD, on unresolved OpenSSL imports and a duplicate duckdb_signature
  # section, and nothing in CI noticed). It runs test/wasm/run.mjs -- the whole
  # test/sql suite -- against the wasm_eh artifact the build job produced.
  # Stays on the v1.5.6 line: the newest @duckdb/duckdb-wasm (1.33.1-dev65.0)
  # bundles engine v1.5.6, and DuckDB-Wasm rejects an extension built for a
  # different engine. When a duckdb-wasm build bundling v2.0.0 ships, bump
  # test/wasm/package.json, `needs` and the artifact name together.
  duckdb-latest-wasm-runtime-test:
    name: WASM runtime test (Node harness, v1.5.6 wasm_eh)
    needs: duckdb-latest-build
    # !cancelled(), not result == 'success': the build job fails as a whole when
    # any arch fails, and an unrelated Windows failure must not skip this test
    # (which would then block every deploy). A missing wasm_eh artifact fails
    # the download step below instead.
    if: ${{ !cancelled() }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Submodules not needed: the harness uses test/ and the downloaded .wasm.

      - name: Download built wasm_eh extension
        uses: actions/download-artifact@v4
        with:
          name: anofox_optimize-v1.5.6-extension-wasm_eh
          path: wasm-artifact

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install harness dependencies
        run: npm --prefix test/wasm ci --ignore-scripts

      - name: Section walker self-test
        run: python3 scripts/wasm_signature_sections.py --self-test

      - name: Run DuckDB-Wasm load + runtime harness
        run: |
          EXT=$(find wasm-artifact -name 'anofox_optimize.duckdb_extension.wasm' | head -1)
          if [ -z "$EXT" ]; then echo "::error::built wasm extension not found in artifact"; exit 1; fi
          echo "Testing extension: $EXT"
          python3 scripts/wasm_signature_sections.py check "$EXT"
          node test/wasm/run.mjs --ext "$EXT"

  duckdb-latest-deploy:
    name: Deploy extension binaries (v1.5.6)
    needs: [duckdb-latest-build, duckdb-latest-smoke-test, duckdb-latest-visualization-pickup, duckdb-latest-wasm-runtime-test]
    # Run the deploy step even when a non-essential build matrix entry fails.
    # The deploy job itself fans out per arch and only pushes the artifacts
    # that actually exist. The wasm runtime test is the exception: a wasm
    # artifact that does not LOAD must not ship (#9), so its failure blocks
    # the deploy.
    if: ${{ !cancelled() && needs.duckdb-latest-wasm-runtime-test.result == 'success' }}
    uses: ./.github/workflows/_extension_deploy.yml
    secrets: inherit
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5-variegata
      extension_name: anofox_optimize
      exclude_archs: 'windows_amd64_rtools;windows_amd64_mingw'
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
      deploy_versioned: ${{ startsWith(github.ref, 'refs/tags/v') }}
