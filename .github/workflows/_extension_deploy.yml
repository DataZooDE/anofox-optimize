#
# Reusable workflow that deploys the artifacts produced by github.com/duckdb/duckdb/.github/workflows/_extension_distribution.yml
#
# note: this workflow needs to be located in the extension repository, as it requires secrets to be passed to the
# deploy script. However, it should generally not be necessary to modify this workflow in your extension repository, as
# this workflow can be configured to use a custom deploy script.


name: Extension Deployment
on:
  workflow_call:
    inputs:
      # The name of the extension
      extension_name:
        required: true
        type: string
      # DuckDB version to build against
      duckdb_version:
        required: true
        type: string
      # The extension-ci-tools ref (branch/tag) the build job used, e.g.
      # v1.5-variegata or v2.0-cyanoptera. The deploy arch matrix is parsed from
      # it, NOT from this repo's own extension-ci-tools submodule: the lines ship
      # different archs (v2.0-cyanoptera no longer builds osx_amd64, v1.5 does),
      # so a matrix from the wrong line either expects an artifact the build never
      # produced or silently skips one it did. Falls back to duckdb_version when
      # empty (rolling patch releases such as v1.5.6 have no matching branch, so
      # every caller here passes it).
      ci_tools_version:
        required: false
        type: string
        default: ""
      # ';' separated list of architectures to exclude, for example: 'linux_amd64;osx_arm64'
      exclude_archs:
        required: false
        type: string
        default: ""
      # Whether to upload this deployment as the latest. This may overwrite a previous deployment.
      deploy_latest:
        required: false
        type: boolean
        default: false
      # Whether to upload this deployment under a versioned path. These will not be deleted automatically
      deploy_versioned:
        required: false
        type: boolean
        default: false
      # Postfix added to artifact names. Can be used to guarantee unique names when this workflow is called multiple times
      artifact_postfix:
        required: false
        type: string
        default: ""
      # Override the default deploy script with a custom script
      deploy_script:
        required: false
        type: string
        default: "./scripts/extension-upload.sh"
      # Override the default matrix parse script with a custom script
      matrix_parse_script:
        required: false
        type: string
        default: "./extension-ci-tools/scripts/modify_distribution_matrix.py"

jobs:
  generate_matrix:
    name: Generate matrix
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # Nothing to deploy (PR runs, branch pushes): skip the matrix too, so the
    # deploy job is skipped rather than parsing a matrix it never uses.
    if: ${{ inputs.deploy_latest || inputs.deploy_versioned }}
    outputs:
      deploy_matrix: ${{ steps.parse-matrices.outputs.deploy_matrix }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: 'true'

      - name: Checkout DuckDB to version
        run: |
          cd duckdb
          git fetch --depth 1 origin tag ${{ inputs.duckdb_version }}
          git checkout ${{ inputs.duckdb_version }}

      - name: Checkout extension-ci-tools to version
        # Submodules are pinned to one DuckDB version; for a deploy
        # against another line we need the matching tools so the parsed
        # architecture matrix lines up with what that line's build job
        # produced (ci_tools_version, falling back to duckdb_version).
        # Branch first, tag fallback.
        env:
          REF: ${{ inputs.ci_tools_version != '' && inputs.ci_tools_version || inputs.duckdb_version }}
        run: |
          cd extension-ci-tools
          git fetch --depth 1 origin "$REF" || \
            git fetch --depth 1 origin tag "$REF"
          git checkout FETCH_HEAD
          echo "Deploy matrix from extension-ci-tools $REF ($(git rev-parse --short HEAD))"

      - id: parse-matrices
        run: |
          python3 ${{ inputs.matrix_parse_script }} --input ./extension-ci-tools/config/distribution_matrix.json --deploy_matrix --output deploy_matrix.json --exclude "${{ inputs.exclude_archs }}" --reduced_ci_mode auto --pretty
          deploy_matrix="`cat deploy_matrix.json`"
          echo deploy_matrix=$deploy_matrix >> $GITHUB_OUTPUT
          echo `cat $GITHUB_OUTPUT`

  deploy:
    name: Deploy
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: generate_matrix
    if: ${{ needs.generate_matrix.outputs.deploy_matrix != '{}' && needs.generate_matrix.outputs.deploy_matrix != '' }}
    strategy:
      # One missing artifact (e.g. a Windows build that didn't produce one)
      # must not cancel sibling per-arch deploys — Linux / macOS / wasm
      # publishing should proceed independently.
      fail-fast: false
      matrix: ${{fromJson(needs.generate_matrix.outputs.deploy_matrix)}}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          role-to-assume: arn:aws:iam::331993160594:role/ErplGithubOicdRole
          role-session-name: ErplGithubOicdSession
          aws-region: eu-west-1

      - name: Checkout DuckDB to version
        run: |
          cd duckdb
          git fetch --depth 1 origin tag ${{ inputs.duckdb_version }}
          git checkout ${{ inputs.duckdb_version }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.extension_name }}-${{ inputs.duckdb_version }}-extension-${{matrix.duckdb_arch}}${{inputs.artifact_postfix}}${{startsWith(matrix.duckdb, 'wasm') && '.wasm' || ''}}
          path: |
            /tmp/extension

      # Needed by the Deploy step for the wasm archs the harness can boot (#9):
      # extension-upload.sh LOADs the exact bytes in the DuckDB-Wasm Node
      # harness BEFORE uploading them.
      - uses: actions/setup-node@v4
        if: ${{ matrix.duckdb_arch == 'wasm_eh' || matrix.duckdb_arch == 'wasm_mvp' }}
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: test/wasm/package-lock.json

      - name: Install WASM harness dependencies
        if: ${{ matrix.duckdb_arch == 'wasm_eh' || matrix.duckdb_arch == 'wasm_mvp' }}
        run: npm --prefix test/wasm ci --ignore-scripts

      - name: Deploy
        shell: bash
        env:
          BUCKET_NAME: ${{ vars.DEPLOY_S3_BUCKET }}
        run: |
          pwd
          python3 -m pip install pip awscli
          git config --global --add safe.directory '*'
          cd duckdb
          git fetch --tags --force
          export DUCKDB_VERSION=`git tag --points-at HEAD`
          export DUCKDB_VERSION=${DUCKDB_VERSION:=`git log -1 --format=%h`}
          cd ..
          git fetch --tags --force
          export EXT_VERSION=`git tag --points-at HEAD`
          export EXT_VERSION=${EXT_VERSION:=`git log -1 --format=%h`}
          ${{ inputs.deploy_script }} ${{ inputs.extension_name }} $EXT_VERSION $DUCKDB_VERSION ${{ matrix.duckdb_arch }} $BUCKET_NAME ${{inputs.deploy_latest || 'true' && 'false'}} ${{inputs.deploy_versioned || 'true' && 'false'}}
          # Post-upload check (#9): download every object the deploy script
          # just uploaded (per its manifest) and confirm it is byte-identical
          # to the artifact its pre-upload gate verified. Native archs exit 0
          # immediately.
          ./scripts/extension-verify-upload.sh ${{ inputs.extension_name }} ${{ matrix.duckdb_arch }}
